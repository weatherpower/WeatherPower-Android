name: Upload APK artifact
description: >
  Dependency-free uploader for workflow artifacts (the same Actions artifact service that
  actions/upload-artifact v4+ uses). Kept in this repository so the build works even when the
  Actions policy only allows actions owned by this account.
inputs:
  name:
    description: Artifact name shown on the workflow run page.
    required: true
  path:
    description: File to upload (for example the zipped debug APK).
    required: true
runs:
  using: node24
  main: index.js
