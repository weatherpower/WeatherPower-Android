name: Android debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Only GitHub-authored actions, pinned to full commit SHAs, so restrictive Actions policies accept the workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships JDK 17 and the Android SDK (ANDROID_HOME) with licenses accepted;
      # AGP downloads any missing platform/build-tools on its own.
      - name: Use JDK 17 and the runner's Android SDK
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; fi
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Check web assets parse
        run: |
          for f in app/src/main/assets/wp-*.js; do node --check "$f"; done

      - name: Build debug APK
        # Debug builds use the SDK's auto-generated debug key; no signing secrets are needed.
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --no-daemon assembleDebug -PweatherPowerDevBuild=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WeatherPower-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
