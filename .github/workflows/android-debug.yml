name: Android debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No marketplace or github.com/actions/* actions: the repository's Actions policy only accepts
# actions it owns, so checkout is plain git and the upload uses the local action in .github/actions.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --oneline

      # ubuntu-latest ships JDK 17 and the Android SDK (ANDROID_HOME) with licenses accepted;
      # AGP downloads any missing platform/build-tools on its own.
      - name: Use JDK 17
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"; fi
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Check web assets parse
        run: |
          for f in app/src/main/assets/wp-*.js; do node --check "$f"; done

      - name: Build debug APK
        # Debug builds use the SDK's auto-generated debug key; no signing secrets are needed.
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --no-daemon assembleDebug -PweatherPowerDevBuild=${{ github.run_number }}
          ls -l app/build/outputs/apk/debug/
          cd app/build/outputs/apk/debug && zip -q -j "$RUNNER_TEMP/WeatherPower-debug.zip" *.apk

      - name: Upload debug APK
        uses: ./.github/actions/upload-apk
        with:
          name: WeatherPower-debug-${{ github.run_number }}
          path: ${{ runner.temp }}/WeatherPower-debug.zip
